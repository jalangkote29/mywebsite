<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Absensi QR - Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Firebase SDK & Konfigurasi -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDkxFG6D455TM0SGEpKbinHKlRyIzsE8o",
            authDomain: "smart-absen-pro.firebaseapp.com",
            databaseURL: "https://smart-absen-pro-default-rtdb.firebaseio.com",
            projectId: "smart-absen-pro",
            storageBucket: "smart-absen-pro.appspot.com",
            messagingSenderId: "794080216837",
            appId: "1:794080216837:web:64b0029602b97d107bd96c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.prosesDataAbsensiOnline = async function(decodedText) {
            const bersih = decodedText.trim();
            if (!bersih) return;

            const now = new Date();
            const tanggalHariIni = now.toLocaleDateString('id-ID');
            const jamSekarang = now.toTimeString().slice(0, 5);
            const waktuLengkap = now.toLocaleString('id-ID');
            const sesiPilih = document.getElementById('pilihan-sesi').value;

            const snapshot = await get(ref(db, 'dataAbsensiPro'));
            let daftarAbsen = [];
            if (snapshot.exists()) {
                snapshot.forEach((childSnapshot) => {
                    daftarAbsen.push({ firebaseId: childSnapshot.key, ...childSnapshot.val() });
                });
            }

            const sudahAbsen = daftarAbsen.some(item => 
                item.nama.toLowerCase() === bersih.toLowerCase() && 
                item.tanggal === tanggalHariIni && 
                item.sesi === sesiPilih
            );

            if (sudahAbsen) {
                tampilkanNotifikasi('peringatan', 'Absensi Ditolak (Duplikat)', `"${bersih}" sudah tercatat hadir pada sesi "${sesiPilih}" hari ini.`);
                return;
            }

            // Batas jam otomatis diset default atau mengikuti sistem pusat tanpa bisa diubah umum
            const snapshotBatas = await get(ref(db, 'pengaturan/batasJamMasuk'));
            const batasJam = snapshotBatas.exists() ? snapshotBatas.val() : "07:30";
            const statusKehadiran = jamSekarang > batasJam ? "Terlambat" : "Tepat Waktu";

            await push(ref(db, 'dataAbsensiPro'), {
                nama: bersih,
                sesi: sesiPilih,
                tanggal: tanggalHariIni,
                jam: jamSekarang,
                waktuLengkap: waktuLengkap,
                status: statusKehadiran
            });

            tampilkanNotifikasi('sukses', 'Absensi Berhasil Tercatat!', `[${sesiPilih}] ${bersih} • Pukul ${jamSekarang} (${statusKehadiran})`);
        };
    </script>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800">

    <nav class="bg-indigo-700 text-white shadow-lg">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i data-lucide="qr-code" class="w-7 h-7"></i>
                <span class="font-bold text-xl tracking-tight">SmartAbsen QR Online</span>
            </div>
            <div class="text-xs bg-indigo-800 px-3 py-1.5 rounded-lg border border-indigo-600 font-medium">
                Portal Peserta / Umum
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="md:col-span-2 space-y-6">
            <div class="bg-white rounded-2xl shadow-md p-6 border border-slate-200">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h1 class="text-2xl font-bold text-slate-800">Portal Kehadiran Online</h1>
                        <p class="text-sm text-slate-500">Scan QR Code atau pilih menu di bawah.</p>
                    </div>
                    <span id="jam-digital" class="bg-indigo-50 text-indigo-700 font-mono font-bold px-3 py-1.5 rounded-lg text-sm border border-indigo-200">
                        00:00:00
                    </span>
                </div>

                <div class="mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-wrap items-center justify-between gap-4">
                    <div class="flex items-center space-x-2">
                        <i data-lucide="calendar-clock" class="w-5 h-5 text-indigo-600"></i>
                        <span class="text-sm font-semibold text-slate-700">Pilih Sesi Absen:</span>
                    </div>
                    <select id="pilihan-sesi" class="bg-white border border-slate-300 px-3 py-1.5 rounded-lg text-sm font-semibold text-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer">
                        <option value="Jam Masuk Pagi">Jam Masuk Pagi</option>
                        <option value="Kegiatan Ekstrakurikuler">Kegiatan Ekstrakurikuler</option>
                        <option value="Ujian / Penilaian">Ujian / Penilaian</option>
                        <option value="Jam Pulang">Jam Pulang</option>
                    </select>
                </div>

                <div class="flex border-b border-slate-200 mb-6 relative z-10">
                    <button type="button" id="tab-upload" onclick="gantiTab('upload')" class="cursor-pointer flex items-center space-x-2 px-4 py-2.5 border-b-2 border-indigo-600 text-indigo-600 font-semibold text-sm transition">
                        <i data-lucide="upload-cloud" class="w-4 h-4"></i>
                        <span>Upload Gambar QR</span>
                    </button>
                    <button type="button" id="tab-kamera" onclick="gantiTab('kamera')" class="cursor-pointer flex items-center space-x-2 px-4 py-2.5 border-b-2 border-transparent text-slate-500 hover:text-slate-700 font-semibold text-sm transition">
                        <i data-lucide="camera" class="w-4 h-4"></i>
                        <span>Scan Kamera Langsung</span>
                    </button>
                </div>

                <div id="area-upload" class="block">
                    <label for="qr-input-file" class="flex flex-col items-center justify-center w-full h-56 border-2 border-dashed border-indigo-300 rounded-xl cursor-pointer bg-indigo-50/40 hover:bg-indigo-50 transition">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6 text-center px-4">
                            <div class="bg-indigo-100 p-3 rounded-full mb-3 text-indigo-600">
                                <i data-lucide="image-plus" class="w-8 h-8"></i>
                            </div>
                            <p class="mb-2 text-sm text-slate-700"><span class="font-semibold text-indigo-600">Klik untuk pilih file QR</span> atau seret gambar ke sini</p>
                        </div>
                        <input id="qr-input-file" type="file" accept="image/*" class="hidden" />
                    </label>
                    <div id="file-decoder-hidden" class="hidden"></div>
                </div>

                <div id="area-kamera" class="hidden text-center">
                    <div id="camera-container" class="w-full max-w-md mx-auto overflow-hidden rounded-xl border border-slate-300 bg-slate-900 min-h-[250px] flex items-center justify-center">
                        <div id="reader" class="w-full"></div>
                    </div>
                    <button type="button" onclick="gantiTab('upload')" class="mt-4 bg-rose-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-rose-700 transition cursor-pointer">
                        Matikan Kamera
                    </button>
                </div>

                <div id="alert-box" class="hidden mt-6 p-4 rounded-xl border flex items-start space-x-3">
                    <div id="alert-icon"></div>
                    <div>
                        <h4 id="alert-title" class="font-bold text-sm"></h4>
                        <p id="alert-desc" class="text-sm mt-0.5"></p>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-md p-6 border border-slate-200">
                <div class="flex items-center space-x-2 text-slate-700 mb-2">
                    <i data-lucide="user-plus" class="w-5 h-5 text-indigo-600"></i>
                    <h2 class="font-bold text-base">Absen Manual Darurat</h2>
                </div>
                <div class="flex gap-2 mt-3">
                    <input type="text" id="input-manual-nama" placeholder="Masukkan Nama Lengkap & Kelas..." class="flex-1 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button type="button" onclick="absenManual()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition cursor-pointer">
                        Catat Hadir
                    </button>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-md p-6 border border-slate-200 flex flex-col justify-between">
            <div>
                <div class="flex items-center space-x-2 text-indigo-700 mb-2">
                    <i data-lucide="sparkles" class="w-5 h-5"></i>
                    <h2 class="font-bold text-lg">Buat QR Peserta</h2>
                </div>
                <div class="space-y-3 mt-4">
                    <input type="text" id="input-nama-qr" placeholder="Contoh: Budi - XII IPA 1" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button type="button" onclick="buatQR()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold py-2 rounded-lg text-sm transition cursor-pointer">
                        Generate QR Code
                    </button>
                </div>
                <div id="qr-preview-container" class="hidden mt-6 flex flex-col items-center p-4 bg-slate-50 rounded-xl border border-slate-200">
                    <div id="qrcode" class="bg-white p-2 rounded shadow-sm"></div>
                    <p id="qr-label" class="text-xs font-bold text-slate-700 mt-2 text-center"></p>
                    <button type="button" onclick="downloadQR()" class="mt-3 text-xs bg-indigo-600 text-white px-3 py-1.5 rounded-md">Unduh QR</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        setInterval(() => {
            document.getElementById('jam-digital').innerText = new Date().toLocaleTimeString('id-ID');
        }, 1000);

        function bunyiBeep(sukses = true) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = sukses ? 'sine' : 'sawtooth';
                osc.frequency.value = sukses ? 880 : 220;
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch (e) {}
        }

        function tampilkanNotifikasi(tipe, judul, pesan) {
            const box = document.getElementById('alert-box');
            const title = document.getElementById('alert-title');
            const desc = document.getElementById('alert-desc');
            const icon = document.getElementById('alert-icon');

            box.classList.remove('hidden', 'bg-emerald-50', 'border-emerald-200', 'text-emerald-800', 'bg-amber-50', 'border-amber-200', 'text-amber-800', 'bg-rose-50', 'border-rose-200', 'text-rose-800');

            if (tipe === 'sukses') {
                box.classList.add('bg-emerald-50', 'border-emerald-200', 'text-emerald-800');
                icon.innerHTML = `<i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-600 mt-0.5"></i>`;
                bunyiBeep(true);
            } else if (tipe === 'peringatan') {
                box.classList.add('bg-amber-50', 'border-amber-200', 'text-amber-800');
                icon.innerHTML = `<i data-lucide="alert-triangle" class="w-5 h-5 text-amber-600 mt-0.5"></i>`;
                bunyiBeep(false);
            } else {
                box.classList.add('bg-rose-50', 'border-rose-200', 'text-rose-800');
                icon.innerHTML = `<i data-lucide="x-circle" class="w-5 h-5 text-rose-600 mt-0.5"></i>`;
                bunyiBeep(false);
            }

            title.innerText = judul;
            desc.innerText = pesan;
            lucide.createIcons();
        }

        function absenManual() {
            const inputNama = document.getElementById('input-manual-nama');
            if (!inputNama.value.trim()) return alert("Masukkan nama terlebih dahulu!");
            window.prosesDataAbsensiOnline(inputNama.value.trim());
            inputNama.value = "";
        }

        document.getElementById('qr-input-file').addEventListener('change', async function(e) {
            if (!e.target.files || e.target.files.length === 0) return;
            try {
                const fileScanner = new Html5Qrcode("file-decoder-hidden");
                const decodedText = await fileScanner.scanFile(e.target.files[0], false);
                window.prosesDataAbsensiOnline(decodedText);
                fileScanner.clear();
            } catch (err) {
                tampilkanNotifikasi('error', 'QR Tidak Terbaca', 'Pastikan gambar QR valid.');
            } finally {
                e.target.value = "";
            }
        });

        let html5QrCam = null;
        let kameraSedangJalan = false;
        let jedaScan = false;

        async function gantiTab(mode) {
            const tabUpload = document.getElementById('tab-upload');
            const tabKamera = document.getElementById('tab-kamera');
            const areaUpload = document.getElementById('area-upload');
            const areaKamera = document.getElementById('area-kamera');
            document.getElementById('alert-box').classList.add('hidden');

            if (mode === 'upload') {
                tabUpload.className = "cursor-pointer flex items-center space-x-2 px-4 py-2.5 border-b-2 border-indigo-600 text-indigo-600 font-semibold text-sm transition";
                tabKamera.className = "cursor-pointer flex items-center space-x-2 px-4 py-2.5 border-b-2 border-transparent text-slate-500 font-semibold text-sm transition";
                areaUpload.classList.remove('hidden');
                areaKamera.classList.add('hidden');
                if (html5QrCam && kameraSedangJalan) {
                    await html5RootCamStop();
                }
            } else {
                tabKamera.className = "cursor-pointer flex items-center space-x-2 px-4 py-2.5 border-b-2 border-indigo-600 text-indigo-600 font-semibold text-sm transition";
                tabUpload.className = "cursor-pointer flex items-center space-x-2 px-4 py-2.5 border-b-2 border-transparent text-slate-500 font-semibold text-sm transition";
                areaKamera.classList.remove('hidden');
                areaUpload.classList.add('hidden');

                if (!kameraSedangJalan) {
                    try {
                        html5QrCam = new Html5Qrcode("reader");
                        await html5QrCam.start(
                            { facingMode: "environment" },
                            { fps: 10, qrbox: { width: 250, height: 250 } },
                            (text) => {
                                if (jedaScan) return;
                                jedaScan = true;
                                window.prosesDataAbsensiOnline(text);
                                setTimeout(() => { jedaScan = false; }, 2500);
                            },
                            () => {}
                        );
                        kameraSedangJalan = true;
                    } catch (e) {
                        tampilkanNotifikasi('error', 'Kamera Error', 'Gunakan tab Upload Gambar.');
                    }
                }
            }
        }

        async function html5RootCamStop() {
            if (html5QrCam && kameraSedangJalan) {
                await html5QrCam.stop().catch(()=>{});
                kameraSedangJalan = false;
            }
        }

        function buatQR() {
            const teks = document.getElementById('input-nama-qr').value.trim();
            if (!teks) return alert("Masukkan nama!");
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById('qrcode'), { text: teks, width: 160, height: 160 });
            document.getElementById('qr-label').innerText = teks;
            document.getElementById('qr-preview-container').classList.remove('hidden');
        }

        function downloadQR() {
            const img = document.querySelector('#qrcode img');
            if (img) {
                const link = document.createElement('a');
                link.href = img.src;
                link.download = `QR_Peserta.png`;
                link.click();
            }
        }
    </script>
</body>
</html>
